name: autospot
description: "AI car spotting collector — photograph cars, identify them, build your garage."
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  image_picker: ^1.1.2
  camera: ^0.11.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.5.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  google_fonts: ^6.3.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  crypto: ^3.0.6
  image: ^4.5.4
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/cars/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: assets/images/icon.png
  adaptive_icon_background: "#0B0D10"
  adaptive_icon_foreground: assets/images/icon.png
